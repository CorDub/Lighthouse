version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        overrides:
          - column: "users.language"
            go_type: 
              type: "Language"
          - column: "users.role"
            go_type: 
              type: "Role"